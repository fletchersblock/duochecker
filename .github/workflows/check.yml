name: Check iPhone Duo stock

on:
  schedule:
    - cron: "*/5 * * * *"  # GitHub's minimum; runs are often delayed a few minutes
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 duochecker.py --once || true
