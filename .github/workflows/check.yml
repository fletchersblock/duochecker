name: Check iPhone Duo stock

# Private repo (2,000 free minutes/month): one check per run, every ~5 minutes.
# Public repo (unlimited minutes): each run checks every 60s for ~5h40m, and the
# schedule keeps the next run queued so there's no gap.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: duocheck
  cancel-in-progress: false

env:
  # Subscribe to this topic in the ntfy app.
  NTFY_TOPIC: duo-dc-faf6f779f
  # Optional free email copy of each alert (via ntfy): set the ALERT_EMAIL repo secret.
  ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
  # Optional paid text messages. Set these as repo secrets (Settings > Secrets and variables >
  # Actions) so the phone number and keys stay private: SMS_TO, plus TEXTBELT_KEY or
  # TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_FROM.
  SMS_TO: ${{ secrets.SMS_TO }}
  TEXTBELT_KEY: ${{ secrets.TEXTBELT_KEY }}
  TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
  TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
  TWILIO_FROM: ${{ secrets.TWILIO_FROM }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Send test alert (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: python3 duochecker.py --test-alert
      - name: Check stock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api repos/${{ github.repository }} --jq .private)" = "true" ]; then
            python3 -u duochecker.py --once || true
          else
            python3 -u duochecker.py --minutes 340
          fi
