name: Check iPhone Duo stock

# The schedule is off: Apple answers GitHub's servers with HTTP 541 (bot block),
# so scheduled runs only burn Actions minutes. Run the script from a home connection instead.
on:
  workflow_dispatch:

concurrency:
  group: duocheck

env:
  # Subscribe to this topic in the ntfy app. The repo is private, so it isn't public.
  NTFY_TOPIC: duo-dc-faf6f779f5

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Send test alert (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: python3 duochecker.py --test-alert
      - name: Check stock
        run: python3 duochecker.py --once || true
